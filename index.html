<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6590c4">
  <meta name="description" content="灵感小作，一些可以动手玩的网页创作。">
  <title>灵感小作 · Little Creations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sketchbook" aria-label="灵感小作，作品合集">
    <img class="meadow" src="./assets/blue-meadow.png" alt="蓝色蜡笔画布，左下角开着彩色小花，右上角有两只白鸟" fetchpriority="high">
    <!-- 为后续手写标题保留的区域，可放入透明 PNG 或 SVG 图片。 -->
    <div class="handwriting-space" aria-hidden="true"></div>
    <a class="github" href="https://github.com/SasaFreya/little-creations" aria-label="查看 GitHub 源码仓库">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5H5v14h14v-3M12 5h7v7M10 14l9-9"/></svg>
    </a>
    <section class="works" aria-label="作品">
      <a class="work" href="./lotus-calendar/" aria-label="打开莲 · 岁时荷花日历">
        <span class="tape" aria-hidden="true"></span>
        <img src="./lotus-calendar/assets/lotus.png" alt="粉色荷花日历作品入口">
        <span class="open" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
      <a class="work flower-work" href="./flower-letter/" aria-label="打开花里有一封信，互动花束">
        <span class="tape" aria-hidden="true"></span>
        <img src="./flower-letter/preview.svg" alt="一束蓝色包装的彩色鲜花">
        <span class="open" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
      <a class="work window-work" href="./window-blooms/" aria-label="打开窗前清供，互动菊花与青花瓷瓶">
        <span class="tape" aria-hidden="true"></span>
        <img src="./window-blooms/preview.svg" alt="粉白菊花与青花瓷瓶">
        <span class="open" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
      <a class="work ballet-work" href="./little-ballet/" aria-label="打开花间小剧场，芭蕾舞蹈与小课堂">
        <span class="tape" aria-hidden="true"></span>
        <img src="./little-ballet/preview.svg" alt="紫裙女孩在花毯上跳芭蕾">
        <span class="open" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </section>
  </main>
</body>
</html>
