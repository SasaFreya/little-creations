<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8e4d8"><title>窗前清供 · 灵感小作</title><link rel="stylesheet" href="style.css"></head><body><header><a href="../">← <span>灵感小作</span></a><span>003 / A QUIET AFTERNOON</span></header><main><aside><div class="eyebrow">A MOMENT BY THE WINDOW</div><h1>窗前<br>清供</h1><p>借一寸日光，<br>等一朵花慢慢舒展。</p><div class="instructions">轻点花朵 · 拂过枝叶<br>拖动下方刻度，移动日光</div></aside><div class="art" id="art"><svg id="scene" viewBox="0 0 720 900" role="group" aria-label="窗前的粉白菊花、绿枝与青花瓷瓶"></svg><div class="time" id="time">14:30</div></div><section class="controls" aria-label="日光和微风控制"><div class="light-label"><label for="sun">窗边日光</label><output id="sun-label" for="sun">午后</output></div><input type="range" id="sun" min="0" max="100" value="62" aria-label="调整窗边日光"><div class="scale"><span>晨光</span><span>暮色</span></div><div class="actions"><button id="wind" aria-pressed="true">微风 <span>开</span></button><button id="bloom">让花都舒展 ↗</button></div><p id="note" role="status">一瓶花，一段不必着急的时间。</p></section></main><footer><span>慢慢看，慢慢开。</span><span>BOTANICAL STUDY · CHRYSANTHEMUM</span></footer><script src="app.js"></script></body></html>
