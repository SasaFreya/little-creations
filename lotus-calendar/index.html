<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee9da"><title>莲 · 岁时 | 一年的好日子</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./">莲<span>岁 时</span></a><div class="intro">把日子，过成花开的样子。</div><button id="print">↗ <span>收藏这一年</span></button></header><main><div class="toolbar"><span class="eyebrow">A YEAR IN BLOOM</span><div class="year-nav"><button id="prev" aria-label="上一年">←</button><span id="year-label"></span><button id="next" aria-label="下一年">→</button></div><button id="today">回到今年 <span>↗</span></button></div><section class="poster" aria-label="全年日历"><div class="calendar"><div class="heading"><div class="small-title">EVERY DAY, A LITTLE CLOSER TO YOURSELF</div><h1><span id="hero-year"></span> will be my year</h1><p>愿每一个平凡的日子，都悄悄盛开。</p></div><div id="months"></div><div class="poster-bottom"><span>慢慢生长，自在盛放</span><span>LOTUS · ANNUAL CALENDAR</span></div></div></section><footer><div><span class="dot"></span> 点击日期，留下一件值得记住的小事</div><span id="count">0 个被珍藏的日子</span><span class="edition">THE SLOW DAYS COLLECTION / № 01</span></footer></main><dialog id="editor"><form id="note-form"><div class="dialog-head"><span id="selected-date"></span><button type="button" id="close" aria-label="关闭">×</button></div><h2>让这一天，留在花里。</h2><label for="note">写下一件小事</label><textarea id="note" maxlength="300" placeholder="一个约定、一点期待，或是今天的小小幸福……"></textarea><div class="dialog-actions"><button type="button" id="remove">删除记录</button><button class="save" type="submit">珍藏这一天 ↗</button></div><p class="privacy">记录仅保存在当前浏览器中</p></form></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
